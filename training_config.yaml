model:
  name: "microsoft/Phi-3.5-mini-instruct"
  max_length: 2048
  trust_remote_code: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  # Train embedding + LM head so added tool tokens are not random at inference (critical).
  modules_to_save: ["embed_tokens", "lm_head"]
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./results"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  optim: "paged_adamw_32bit"
  save_steps: 500
  logging_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.001
  fp16: false
  bf16: true
  max_grad_norm: 0.3
  max_steps: -1
  warmup_ratio: 0.03
  group_by_length: true
  lr_scheduler_type: "cosine"
  report_to: "none"
  gradient_checkpointing: true
  pad_to_multiple_of: 8
  save_total_limit: 3

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: false

data:
  train_dataset: "/content/train_dataset.json"
  eval_dataset: "/content/eval_dataset.json"
  max_seq_length: 2048
  train_split: 0.9
  seed: 42

evaluation:
  evaluation_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  load_best_model_at_end: true

# Optional post-SFT RL (tool use + reasoning). Plug-in: set enabled: true after SFT is stable.
rl:
  enabled: true
  output_dir: "./results_rl"
  max_steps: 150
  save_steps: 50
  eval_steps: 25
  num_generations: 4
  per_device_prompts: 2
  max_new_tokens: 384
  learning_rate: 1.0e-6
  max_grad_norm: 1.0
  temperature: 0.85
  top_p: 0.95
  reward_scale: 1.0
  eval_num_prompts: 12
  seed: 42